name: Test BigBalls Serie A marcatori

on:
  workflow_dispatch:

jobs:
  test-marcatori:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica chiave e marcatori Serie A 2026
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${BIGBALLS_API_KEY:-}" ]; then
            echo "ERRORE: secret BIGBALLS_API_KEY non trovato."
            exit 1
          fi

          echo "=== TEST CHIAVE ==="
          curl -sS --fail-with-body \
            -H "Authorization: Bearer ${BIGBALLS_API_KEY}" \
            "https://api.bigballsdata.com/v1/user/me" \
            | jq '{plan: .data.plan, limits: .data.limits}'

          echo
          echo "=== MARCATORI SERIE A - SEASON 2026 ==="

          HTTP_CODE="$(
            curl -sS \
              -o /tmp/bigballs_scorers.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${BIGBALLS_API_KEY}" \
              "https://api.bigballsdata.com/v1/leagues/serie-a/top-scorers?season=2026"
          )"

          echo "HTTP: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Risposta API:"
            cat /tmp/bigballs_scorers.json
            exit 1
          fi

          echo "Risposta ricevuta correttamente."
          echo
          echo "--- Anteprima dati ---"
          jq '.' /tmp/bigballs_scorers.json | head -n 220
