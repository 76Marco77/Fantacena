name: Test ESPN Lecce Roma marcatori

on:
  workflow_dispatch:

jobs:
  test-espn-marcatori:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica Lecce-Roma e gol di Malen su ESPN
        run: |
          set -euo pipefail

          echo "=== 1) SCOREBOARD SERIE A 31/08/2026 ==="

          curl -sS --fail-with-body \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard?dates=20260831" \
            -o /tmp/espn_scoreboard.json

          MATCH_ID="$(
            jq -r '
              .events
              | map(select(
                  (
                    ([.competitions[0].competitors[]?.team.displayName,
                      .competitions[0].competitors[]?.team.shortDisplayName,
                      .competitions[0].competitors[]?.team.name]
                     | map(select(. != null) | tostring | ascii_downcase)
                     | join(" ")
                     | contains("lecce"))
                  )
                  and
                  (
                    ([.competitions[0].competitors[]?.team.displayName,
                      .competitions[0].competitors[]?.team.shortDisplayName,
                      .competitions[0].competitors[]?.team.name]
                     | map(select(. != null) | tostring | ascii_downcase)
                     | join(" ")
                     | contains("roma"))
                  )
                ))
              | first
              | .id // empty
            ' /tmp/espn_scoreboard.json
          )"

          echo
          echo "--- Lecce-Roma trovata ---"
          jq '
            .events
            | map(select(.id == "'"${MATCH_ID}"'"))
            | first
            | {
                id,
                name,
                shortName,
                date,
                status: .status.type.description,
                competitors: [.competitions[0].competitors[]? | {
                  team: .team.displayName,
                  homeAway,
                  score
                }]
              }
          ' /tmp/espn_scoreboard.json

          if [ -z "${MATCH_ID}" ]; then
            echo "ERRORE: Lecce-Roma non trovata nello scoreboard ESPN."
            exit 1
          fi

          echo
          echo "Match ID ESPN: ${MATCH_ID}"

          echo
          echo "=== 2) SUMMARY DELLA PARTITA ==="

          curl -sS --fail-with-body \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/summary?event=${MATCH_ID}" \
            -o /tmp/espn_summary.json

          echo
          echo "--- Scoring plays / eventi marcatura, se presenti ---"
          jq '
            {
              scoringPlays: (.scoringPlays // []),
              keyEvents: (
                [
                  .. | objects
                  | select(
                      ((.type.text? // .type.name? // .type? // "") | tostring | ascii_downcase | contains("goal"))
                      or
                      ((.text? // .description? // "") | tostring | ascii_downcase | contains("goal"))
                    )
                ]
              )
            }
          ' /tmp/espn_summary.json | head -n 500

          echo
          echo "=== 3) CERCO MALEN NEL SUMMARY ==="

          jq '
            [
              .. | objects
              | select(
                  (
                    [
                      .displayName?,
                      .shortName?,
                      .fullName?,
                      .name?,
                      .text?,
                      .description?,
                      .athlete?.displayName?,
                      .athlete?.fullName?
                    ]
                    | map(select(. != null) | tostring)
                    | join(" ")
                    | ascii_downcase
                    | contains("malen")
                  )
                )
            ]
          ' /tmp/espn_summary.json

          echo
          echo "=== 4) CONTEGGIO OCCORRENZE MALEN ==="
          grep -oi "malen" /tmp/espn_summary.json | wc -l | awk '{print "Occorrenze Malen nel JSON:", $1}'

          echo
          echo "TEST TERMINATO."
          echo "Se compaiono i due eventi-gol di Malen, ESPN può essere usato per automatizzare i marcatori."
