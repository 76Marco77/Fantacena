
name: Update Gist (Serie A) — stable monotonic results + fixtures

on:
  workflow_dispatch:
    inputs:
      upcoming_order:
        description: "Ordine partite future: asc = dalla più prossima; desc = dalla più lontana"
        required: false
        default: asc
        type: choice
        options: [asc, desc]

permissions: {}

concurrency:
  group: update-serie-a-gist
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Europe/Rome

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check secrets
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$GIST_ID" || { echo "❌ Missing GIST_ID"; exit 1; }
          test -n "$GIST_TOKEN" || { echo "❌ Missing GIST_TOKEN"; exit 1; }
          test -n "$FD_TOKEN" || { echo "❌ Missing FOOTBALL_DATA_TOKEN"; exit 1; }
          echo "::add-mask::$GIST_TOKEN"
          echo "::add-mask::$FD_TOKEN"
          echo "✅ Secrets OK"

      - name: Build and push Gist Serie A Fantacena 2027
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GIST_FILE: Classifica.json
          UPCOMING_ORDER: ${{ github.event.inputs.upcoming_order || vars.UPCOMING_ORDER || 'asc' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const FD='https://api.football-data.org/v4';
          const COMP='SA';
          const TZ='Europe/Rome';
          const MAX_SINGLE_MATCH_CHECKS=4;

          const HEAD_FD={
            'X-Auth-Token':process.env.FD_TOKEN,
            'Accept':'application/json',
            'User-Agent':'fantacena-updater'
          };

          const HEAD_GH={
            'authorization':`token ${process.env.GIST_TOKEN}`,
            'accept':'application/vnd.github+json',
            'user-agent':'fantacena-gist-updater'
          };

          const TARGET_TEAMS=[
            'Atalanta','Bologna','Cagliari','Como','Fiorentina','Frosinone',
            'Genoa','Inter','Juventus','Lazio','Lecce','Milan','Monza','Napoli',
            'Parma','Roma','Sassuolo','Torino','Udinese','Venezia'
          ];

          const TARGET_SET=new Set(TARGET_TEAMS);

          const cleanName=s=>String(s||'')
            .replace(/\s+/g,' ')
            .replace(/\./g,'')
            .trim();

          const aliasPairs=[
            ['Atalanta BC','Atalanta'],
            ['Bologna FC 1909','Bologna'],
            ['Cagliari Calcio','Cagliari'],
            ['Como 1907','Como'],
            ['ACF Fiorentina','Fiorentina'],
            ['Frosinone Calcio','Frosinone'],
            ['Genoa CFC','Genoa'],
            ['FC Internazionale Milano','Inter'],
            ['Internazionale','Inter'],
            ['Inter Milan','Inter'],
            ['Juventus FC','Juventus'],
            ['SS Lazio','Lazio'],
            ['US Lecce','Lecce'],
            ['AC Milan','Milan'],
            ['AC Monza','Monza'],
            ['SSC Napoli','Napoli'],
            ['Parma Calcio 1913','Parma'],
            ['AS Roma','Roma'],
            ['US Sassuolo Calcio','Sassuolo'],
            ['US Sassuolo','Sassuolo'],
            ['Torino FC','Torino'],
            ['Udinese Calcio','Udinese'],
            ['Venezia FC','Venezia'],

            ['Cremonese','Frosinone'],
            ['US Cremonese','Frosinone'],
            ['Hellas Verona','Monza'],
            ['Verona','Monza'],
            ['AC Pisa','Venezia'],
            ['Pisa','Venezia'],
            ['Pisa SC','Venezia']
          ];

          const TEAM_ALIAS=new Map();

          for(const t of TARGET_TEAMS){
            TEAM_ALIAS.set(t.toLowerCase(),t);
          }

          for(const [from,to] of aliasPairs){
            TEAM_ALIAS.set(
              cleanName(from).toLowerCase(),
              to
            );
          }

          const normTeam=s=>{
            const n=cleanName(s);

            if(!n) return '';

            return TEAM_ALIAS.get(n.toLowerCase()) || n;
          };

          const ORDER=
            String(process.env.UPCOMING_ORDER||'asc').toLowerCase()==='desc'
              ? 'desc'
              : 'asc';

          const sleep=ms=>
            new Promise(r=>setTimeout(r,ms));

          async function fetchRetry(
            u,
            opt={},
            tries=4
          ){

            for(let i=0;i<tries;i++){

              const r=await fetch(u,opt).catch(e=>{
                throw new Error(
                  `${opt.method||'GET'} fetch-failed ${u} :: ${e.message||e}`
                );
              });

              if(r.ok){
                return r;
              }

              const txt=
                await r.text().catch(()=>'');

              const retryable=
                [429,500,502,503,504].includes(r.status);

              if(
                !retryable
                ||
                i===tries-1
              ){
                throw new Error(
                  `${opt.method||'GET'} ${r.status} ${u} :: ${txt.slice(0,300).replace(/\s+/g,' ')}`
                );
              }

              await sleep(
                450*Math.pow(2,i)
              );
            }
          }

          async function httpFD(u){

            const r=
              await fetchRetry(
                u,
                {headers:HEAD_FD}
              );

            return r.json();
          }

          async function gh(
            u,
            opt={}
          ){

            return fetchRetry(
              u,
              {
                ...opt,

                headers:{
                  ...HEAD_GH,
                  ...(opt.headers||{})
                }
              }
            );
          }

          async function readCurrent(){

            const r=
              await gh(
                `https://api.github.com/gists/${process.env.GIST_ID}`
              );

            const j=
              await r.json();

            const f=
              j.files?.[
                process.env.GIST_FILE
                ||
                'Classifica.json'
              ];

            try{

              return f?.content
                ? JSON.parse(f.content)
                : {};

            }catch{

              return {};
            }
          }

          async function writeGist(payload){

            const body={
              files:{
                [process.env.GIST_FILE||'Classifica.json']:{
                  content:
                    JSON.stringify(
                      payload,
                      null,
                      2
                    )
                }
              }
            };

            await gh(
              `https://api.github.com/gists/${process.env.GIST_ID}`,
              {
                method:'PATCH',

                headers:{
                  'content-type':'application/json'
                },

                body:
                  JSON.stringify(body)
              }
            );
          }

          function canonicalStatus(s){

            const st=
              String(s||'')
                .trim()
                .toUpperCase()
                .replace(/[-\s]+/g,'_');

            if(
              [
                'FINISHED',
                'AWARDED',
                'POST',
                'FT',
                'FULL_TIME'
              ].includes(st)
            ){
              return 'post';
            }

            if(
              [
                'LIVE',
                'IN_PLAY',
                'PAUSED',
                'HALF_TIME',
                'HT',
                'EXTRA_TIME',
                'PENALTY_SHOOTOUT',
                '1H',
                '2H',
                'IN'
              ].includes(st)
            ){
              return 'in';
            }

            if(
              [
                'SCHEDULED',
                'TIMED',
                'PRE'
              ].includes(st)
            ){
              return 'pre';
            }

            return 'off';
          }

          function rank(s){

            const st=
              canonicalStatus(s);

            if(st==='post'){
              return 3;
            }

            if(st==='in'){
              return 2;
            }

            if(st==='pre'){
              return 1;
            }

            return 0;
          }

          const asNum=v=>
            Number.isFinite(Number(v))
              ? Number(v)
              : 0;

          function normalizeProviderMatch(m){

            const home=
              normTeam(
                m?.homeTeam?.shortName
                ||
                m?.homeTeam?.name
                ||
                m?.homeTeam?.tla
                ||
                m?.home
              );

            const away=
              normTeam(
                m?.awayTeam?.shortName
                ||
                m?.awayTeam?.name
                ||
                m?.awayTeam?.tla
                ||
                m?.away
              );

            const providerStatus=
              String(
                m?.status||''
              ).toUpperCase();

            const status=
              canonicalStatus(
                providerStatus
              );

            return {
              id:
                m?.id
                ??
                null,

              home,

              away,

              sh:
                m?.score?.fullTime?.home
                ??
                m?.score?.regularTime?.home
                ??
                m?.score?.halfTime?.home
                ??
                m?.sh
                ??
                null,

              sa:
                m?.score?.fullTime?.away
                ??
                m?.score?.regularTime?.away
                ??
                m?.score?.halfTime?.away
                ??
                m?.sa
                ??
                null,

              status,

              provider_status:
                providerStatus
                ||
                null,

              start:
                m?.utcDate
                ||
                m?.start
                ||
                null,

              matchday:
                Number(m?.matchday)
                ||
                null,

              provider_last_updated:
                m?.lastUpdated
                ||
                null
            };
          }

          function normalizeStoredMatch(m){

            return {
              ...m,

              home:
                normTeam(
                  m?.home
                ),

              away:
                normTeam(
                  m?.away
                ),

              status:
                canonicalStatus(
                  m?.status
                ),

              start:
                m?.start
                ||
                m?.utcDate
                ||
                null,

              sh:
                m?.sh
                ??
                null,

              sa:
                m?.sa
                ??
                null
            };
          }

          /*
            NON usiamo l'orario nella chiave.

            Se football-data modifica il kickoff,
            Juventus-Parma rimane la stessa partita
            e non viene duplicata.
          */
          function matchKey(r){

            return (
              `${String(r?.home||'').toLowerCase()}`
              +
              '|'
              +
              `${String(r?.away||'').toLowerCase()}`
            );
          }

          function mergeMatch(
            existing,
            incoming
          ){

            if(!existing){
              return incoming;
            }

            if(!incoming){
              return existing;
            }

            const oldStatus=
              canonicalStatus(
                existing.status
              );

            const newStatus=
              canonicalStatus(
                incoming.status
              );

            const oldRank=
              rank(oldStatus);

            const newRank=
              rank(newStatus);

            /*
              REGOLA FONDAMENTALE:

              PRE -> IN -> POST

              MAI AL CONTRARIO.
            */
            if(
              newRank
              <
              oldRank
            ){
              return existing;
            }

            if(
              newRank
              >
              oldRank
            ){

              const advanced={
                ...existing,
                ...incoming,
                status:newStatus
              };

              /*
                Un aggiornamento di stato
                senza punteggio non cancella
                un punteggio già conosciuto.
              */
              if(
                incoming.sh==null
                &&
                existing.sh!=null
              ){
                advanced.sh=
                  existing.sh;
              }

              if(
                incoming.sa==null
                &&
                existing.sa!=null
              ){
                advanced.sa=
                  existing.sa;
              }

              return advanced;
            }

            /*
              STESSO STATO.

              Accettiamo i nuovi dati,
              ma un null non cancella
              un valore già conosciuto.
            */
            const merged={
              ...existing,
              ...incoming,
              status:newStatus
            };

            if(
              incoming.sh==null
              &&
              existing.sh!=null
            ){
              merged.sh=
                existing.sh;
            }

            if(
              incoming.sa==null
              &&
              existing.sa!=null
            ){
              merged.sa=
                existing.sa;
            }

            if(
              incoming.id==null
              &&
              existing.id!=null
            ){
              merged.id=
                existing.id;
            }

            if(
              !incoming.start
              &&
              existing.start
            ){
              merged.start=
                existing.start;
            }

            return merged;
          }

          function putMatch(
            map,
            r
          ){

            if(
              !r?.home
              ||
              !r?.away
            ){
              return;
            }

            if(
              !TARGET_SET.has(r.home)
              ||
              !TARGET_SET.has(r.away)
            ){
              return;
            }

            const k=
              matchKey(r);

            map.set(
              k,
              mergeMatch(
                map.get(k),
                r
              )
            );
          }

          function pad(v){

            return String(v)
              .padStart(2,'0');
          }

          function dstr(d){

            return (
              `${d.getUTCFullYear()}`
              +
              '-'
              +
              `${pad(d.getUTCMonth()+1)}`
              +
              '-'
              +
              `${pad(d.getUTCDate())}`
            );
          }

          async function fetchStandings(){

            const j=
              await httpFD(
                `${FD}/competitions/${COMP}/standings`
              );

            const t=
              j.standings
                ?.find(
                  s=>/TOTAL/i.test(s.type)
                )
                ?.table
              ||
              [];

            const rows=[];
            const seen=new Set();

            for(const r of t){

              const team=
                normTeam(
                  r.team?.shortName
                  ||
                  r.team?.name
                  ||
                  r.team?.tla
                );

              if(
                !TARGET_SET.has(team)
                ||
                seen.has(team)
              ){
                continue;
              }

              seen.add(team);

              rows.push({
                team,
                played:
                  asNum(
                    r.playedGames
                  ),
                points:
                  asNum(
                    r.points
                  )
              });
            }

            for(
              const team
              of
              TARGET_TEAMS
            ){

              if(
                !seen.has(team)
              ){

                rows.push({
                  team,
                  played:0,
                  points:0
                });
              }
            }

            const played=
              rows.map(
                r=>r.played
              );

            const playedMax=
              Math.max(
                0,
                ...played
              );

            const providerMatchday=
              Number(
                j?.season?.currentMatchday
              )
              ||
              0;

            return {
              giornata:
                playedMax,

              providerMatchday:
                Math.max(
                  providerMatchday,
                  playedMax
                ),

              teams:
                rows.map(
                  r=>r.team
                ),

              pos_real:
                rows.map(
                  (_,i)=>i+1
                ),

              played,

              points:
                rows.map(
                  r=>r.points
                )
            };
          }

          async function fetchWindowMatches(
            now
          ){

            const from=
              new Date(
                now.getTime()
                -
                96*60*60*1000
              );

            const to=
              new Date(
                now.getTime()
                +
                5*24*60*60*1000
              );

            const j=
              await httpFD(
                `${FD}/competitions/${COMP}/matches?dateFrom=${dstr(from)}&dateTo=${dstr(to)}`
              );

            return (
              j.matches
              ||
              []
            )
              .map(
                normalizeProviderMatch
              )
              .filter(
                r=>
                  TARGET_SET.has(r.home)
                  &&
                  TARGET_SET.has(r.away)
              );
          }

          async function fetchMatchdayMatches(
            matchday
          ){

            if(
              !Number.isFinite(
                Number(matchday)
              )
              ||
              Number(matchday)<=0
            ){
              return [];
            }

            const j=
              await httpFD(
                `${FD}/competitions/${COMP}/matches?matchday=${Number(matchday)}`
              );

            return (
              j.matches
              ||
              []
            )
              .map(
                normalizeProviderMatch
              )
              .filter(
                r=>
                  TARGET_SET.has(r.home)
                  &&
                  TARGET_SET.has(r.away)
              );
          }

          async function verifySuspiciousMatches(
            map,
            now
          ){

            const candidates=
              [...map.values()]

                .filter(r=>{

                  if(
                    !r?.id
                    ||
                    !r?.start
                  ){
                    return false;
                  }

                  const t=
                    Date.parse(
                      r.start
                    );

                  if(
                    !Number.isFinite(t)
                  ){
                    return false;
                  }

                  const st=
                    canonicalStatus(
                      r.status
                    );

                  /*
                    Ricontrolla:

                    - match già LIVE;
                    - match PRE con kickoff passato.
                  */
                  return (
                    st==='in'
                    ||
                    (
                      st==='pre'
                      &&
                      t<=now.getTime()
                    )
                  );
                })

                .sort(
                  (a,b)=>
                    Date.parse(b.start||0)
                    -
                    Date.parse(a.start||0)
                )

                .slice(
                  0,
                  MAX_SINGLE_MATCH_CHECKS
                );

            for(
              const r
              of
              candidates
            ){

              try{

                const raw=
                  await httpFD(
                    `${FD}/matches/${r.id}`
                  );

                const fresh=
                  normalizeProviderMatch(
                    raw
                  );

                putMatch(
                  map,
                  fresh
                );

                console.log(
                  `🔎 Match ${r.id}: ${fresh.home}-${fresh.away} | ${fresh.provider_status} | ${fresh.sh ?? '-'}-${fresh.sa ?? '-'}`
                );

              }catch(e){

                console.warn(
                  `⚠️ Verifica singola match ${r.id} fallita:`,
                  e.message
                );
              }
            }
          }

          function isZeroStartCurrent(
            current
          ){

            const g=
              asNum(
                current.giornata
              );

            const played=
              Array.isArray(
                current.played
              )
                ?
                  current.played.map(asNum)
                :
                  [];

            const points=
              Array.isArray(
                current.points
              )
                ?
                  current.points.map(asNum)
                :
                  [];

            return (
              g===0
              &&
              played.length>0
              &&
              points.length>0
              &&
              played.every(
                v=>v===0
              )
              &&
              points.every(
                v=>v===0
              )
            );
          }

          (async()=>{

            const now=
              new Date();

            const current=
              await readCurrent();

            const st=
              await fetchStandings();

            /*
              Leggiamo la stessa competizione
              in due modi diversi:

              1. finestra temporale;
              2. giornata corrente.

              Se una delle due risposte è più avanzata,
              viene mantenuta quella migliore.
            */
            const [
              windowMatches,
              matchdayMatches
            ]=
              await Promise.all([
                fetchWindowMatches(now),
                fetchMatchdayMatches(
                  st.providerMatchday
                )
              ]);

            /*
              Protezione pre-campionato.
            */
            if(
              isZeroStartCurrent(current)
              &&
              st.giornata>5
            ){

              console.log(
                `🛑 Preseason guard attiva: Classifica.json resta azzerato. football-data giornata=${st.giornata}`
              );

              return;
            }

            const map=
              new Map();

            /*
              MEMORIA DEL GIST.

              Stavolta conserviamo PRE, IN e POST.

              Questo è fondamentale:
              se Juventus-Parma era già IN,
              una risposta successiva TIMED
              NON la può riportare PRE.

              Se era POST,
              non può tornare IN o PRE.
            */
            const previous=[
              ...(
                Array.isArray(
                  current.results_raw
                )
                  ?
                    current.results_raw
                  :
                    []
              ),

              ...(
                Array.isArray(
                  current.upcoming_raw
                )
                  ?
                    current.upcoming_raw
                  :
                    []
              )
            ];

            for(
              const raw
              of
              previous
            ){

              const r=
                normalizeStoredMatch(
                  raw
                );

              putMatch(
                map,
                r
              );
            }

            /*
              Aggiornamento dalla finestra.
            */
            for(
              const r
              of
              windowMatches
            ){

              putMatch(
                map,
                r
              );
            }

            /*
              Aggiornamento specifico giornata.

              Se questo endpoint restituisce
              uno stato più avanzato rispetto
              al date-range, vince lui.
            */
            for(
              const r
              of
              matchdayMatches
            ){

              putMatch(
                map,
                r
              );
            }

            /*
              Controllo aggiuntivo del singolo match.

              Utile proprio per casi come:
              partita iniziata ma lista ancora TIMED.
            */
            await verifySuspiciousMatches(
              map,
              now
            );

            const minKeep=
              now.getTime()
              -
              96*60*60*1000;

            const maxKeep=
              now.getTime()
              +
              5*24*60*60*1000;

            const results_raw=
              [...map.values()]

                .filter(r=>{

                  const t=
                    Date.parse(
                      r?.start||''
                    );

                  return (
                    Number.isFinite(t)
                    &&
                    t>=minKeep
                    &&
                    t<=maxKeep
                  );
                })

                .sort(
                  (a,b)=>
                    String(
                      a.start||''
                    )
                      .localeCompare(
                        String(
                          b.start||''
                        )
                      )
                );

            let upcoming_raw=
              results_raw

                .filter(r=>{

                  const t=
                    Date.parse(
                      r?.start||''
                    );

                  return (
                    canonicalStatus(
                      r.status
                    )==='pre'
                    &&
                    Number.isFinite(t)
                    &&
                    t>now.getTime()
                  );
                })

                .sort(
                  (a,b)=>{

                    const ta=
                      Date.parse(
                        a.start||''
                      );

                    const tb=
                      Date.parse(
                        b.start||''
                      );

                    if(
                      ta!==tb
                    ){
                      return ta-tb;
                    }

                    return (
                      `${a.home}${a.away}`
                        .localeCompare(
                          `${b.home}${b.away}`
                        )
                    );
                  }
                );

            if(
              ORDER==='desc'
            ){
              upcoming_raw=
                upcoming_raw.reverse();
            }

            const payload={
              ...current,

              giornata:
                st.giornata,

              teams:
                st.teams,

              pos_real:
                st.pos_real,

              played:
                st.played,

              points:
                st.points,

              results_raw,

              upcoming_raw,

              counts:{

                pre:
                  results_raw.filter(
                    r=>
                      canonicalStatus(
                        r.status
                      )==='pre'
                  ).length,

                in:
                  results_raw.filter(
                    r=>
                      canonicalStatus(
                        r.status
                      )==='in'
                  ).length,

                post:
                  results_raw.filter(
                    r=>
                      canonicalStatus(
                        r.status
                      )==='post'
                  ).length
              },

              synced_at:
                now.toISOString(),

              _meta:{

                timezone:
                  TZ,

                order_upcoming:
                  ORDER,

                provider_matchday:
                  st.providerMatchday,

                now_local:
                  new Intl.DateTimeFormat(
                    'sv-SE',
                    {
                      timeZone:TZ,
                      hour12:false,
                      dateStyle:'short',
                      timeStyle:'medium'
                    }
                  ).format(now),

                now_utc:
                  now.toISOString(),

                run_id:
                  process.env.GITHUB_RUN_ID
                  ||
                  null,

                run_attempt:
                  process.env.GITHUB_RUN_ATTEMPT
                  ||
                  null,

                repo:
                  process.env.GITHUB_REPOSITORY
                  ||
                  null,

                workflow:
                  process.env.GITHUB_WORKFLOW
                  ||
                  null,

                sha:
                  process.env.GITHUB_SHA
                  ||
                  null
              },

              _sources:{

                provider:
                  'football-data.org',

                standings:
                  'football-data_standings',

                matches_window:
                  'football-data_matches_-96h_+5d',

                matches_matchday:
                  'football-data_matches_current_matchday',

                suspicious_match_check:
                  'football-data_single_match_max_4',

                scorers:
                  'manual'
              }
            };

            await writeGist(
              payload
            );

            console.log(
              `✅ Gist aggiornato | giornata=${payload.giornata} | providerMatchday=${st.providerMatchday} | results=${results_raw.length} | pre:${payload.counts.pre} in:${payload.counts.in} post:${payload.counts.post}`
            );

          })().catch(e=>{

            console.error(
              '❌ FATAL:',
              e.stack
              ||
              e.message
              ||
              String(e)
            );

            process.exit(1);
          });

