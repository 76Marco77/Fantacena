name: Update Gist (Serie A) — Football-Data + API-Football live

on:
  workflow_dispatch:
    inputs:
      upcoming_order:
        description: "Ordine partite future: asc = dalla più prossima; desc = dalla più lontana"
        required: false
        default: asc
        type: choice
        options: [asc, desc]
      force_api_football:
        description: "Forza 1 chiamata API-Football anche fuori dalle finestre live"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: update-serie-a-gist
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Europe/Rome

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check secrets
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          AF_TOKEN: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          test -n "$GIST_ID" || { echo "❌ Missing GIST_ID"; exit 1; }
          test -n "$GIST_TOKEN" || { echo "❌ Missing GIST_TOKEN"; exit 1; }
          test -n "$FD_TOKEN" || { echo "❌ Missing FOOTBALL_DATA_TOKEN"; exit 1; }
          test -n "$AF_TOKEN" || { echo "❌ Missing API_FOOTBALL_KEY"; exit 1; }
          echo "::add-mask::$GIST_TOKEN"
          echo "::add-mask::$FD_TOKEN"
          echo "::add-mask::$AF_TOKEN"
          echo "✅ Secrets OK"

      - name: Build and push Gist Serie A Fantacena 2027
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          AF_TOKEN: ${{ secrets.API_FOOTBALL_KEY }}
          GIST_FILE: Classifica.json
          UPCOMING_ORDER: ${{ github.event.inputs.upcoming_order || vars.UPCOMING_ORDER || 'asc' }}
          FORCE_API_FOOTBALL: ${{ github.event.inputs.force_api_football || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const FD='https://api.football-data.org/v4';
          const AF='https://v3.football.api-sports.io';

          const COMP='SA';

          // API-Football: Serie A
          const AF_LEAGUE=135;

          // Serie A 2026/27 -> stagione API-Football 2026
          const AF_SEASON=2026;

          const TZ='Europe/Rome';

          const HEAD_FD={
            'X-Auth-Token':process.env.FD_TOKEN,
            'Accept':'application/json',
            'User-Agent':'fantacena-updater'
          };

          const HEAD_AF={
            'x-apisports-key':process.env.AF_TOKEN,
            'Accept':'application/json'
          };

          const HEAD_GH={
            'authorization':`token ${process.env.GIST_TOKEN}`,
            'accept':'application/vnd.github+json',
            'user-agent':'fantacena-gist-updater'
          };

          const TARGET_TEAMS=[
            'Atalanta',
            'Bologna',
            'Cagliari',
            'Como',
            'Fiorentina',
            'Frosinone',
            'Genoa',
            'Inter',
            'Juventus',
            'Lazio',
            'Lecce',
            'Milan',
            'Monza',
            'Napoli',
            'Parma',
            'Roma',
            'Sassuolo',
            'Torino',
            'Udinese',
            'Venezia'
          ];

          const TARGET_SET=new Set(TARGET_TEAMS);

          const cleanName=s=>
            String(s||'')
              .replace(/\s+/g,' ')
              .replace(/\./g,'')
              .trim();

          /*
            Alias necessari perché Fantacena usa ancora
            alcuni nomi logici differenti dalle squadre
            reali 2026/27.
          */
          const aliasPairs=[
            ['Atalanta BC','Atalanta'],
            ['Bologna FC 1909','Bologna'],
            ['Cagliari Calcio','Cagliari'],
            ['Como 1907','Como'],
            ['ACF Fiorentina','Fiorentina'],
            ['Frosinone Calcio','Frosinone'],
            ['Genoa CFC','Genoa'],
            ['FC Internazionale Milano','Inter'],
            ['Internazionale','Inter'],
            ['Inter Milan','Inter'],
            ['Juventus FC','Juventus'],
            ['SS Lazio','Lazio'],
            ['US Lecce','Lecce'],
            ['AC Milan','Milan'],
            ['AC Monza','Monza'],
            ['SSC Napoli','Napoli'],
            ['Parma Calcio 1913','Parma'],
            ['AS Roma','Roma'],
            ['US Sassuolo Calcio','Sassuolo'],
            ['US Sassuolo','Sassuolo'],
            ['Torino FC','Torino'],
            ['Udinese Calcio','Udinese'],
            ['Venezia FC','Venezia'],

            ['Cremonese','Frosinone'],
            ['US Cremonese','Frosinone'],

            ['Hellas Verona','Monza'],
            ['Verona','Monza'],

            ['AC Pisa','Venezia'],
            ['Pisa','Venezia'],
            ['Pisa SC','Venezia']
          ];

          const TEAM_ALIAS=
            new Map(
              TARGET_TEAMS.map(
                t=>[
                  t.toLowerCase(),
                  t
                ]
              )
            );

          for(const [from,to] of aliasPairs){

            TEAM_ALIAS.set(
              cleanName(from).toLowerCase(),
              to
            );
          }

          const normTeam=s=>{

            const n=
              cleanName(s);

            return n
              ?
                (
                  TEAM_ALIAS.get(
                    n.toLowerCase()
                  )
                  ||
                  n
                )
              :
                '';
          };

          const ORDER=
            String(
              process.env.UPCOMING_ORDER
              ||
              'asc'
            ).toLowerCase()==='desc'
              ?
                'desc'
              :
                'asc';

          const FORCE_AF=
            String(
              process.env.FORCE_API_FOOTBALL
              ||
              'false'
            ).toLowerCase()==='true';

          const sleep=ms=>
            new Promise(
              r=>setTimeout(r,ms)
            );

          async function fetchRetry(
            url,
            opt={},
            tries=4
          ){

            for(
              let i=0;
              i<tries;
              i++
            ){

              const r=
                await fetch(
                  url,
                  opt
                ).catch(e=>{

                  throw new Error(
                    `${opt.method||'GET'} ${url} :: ${e.message||e}`
                  );
                });

              if(r.ok){
                return r;
              }

              const txt=
                await r.text()
                  .catch(
                    ()=>''
                  );

              if(
                ![
                  429,
                  500,
                  502,
                  503,
                  504
                ].includes(r.status)
                ||
                i===tries-1
              ){

                throw new Error(
                  `${opt.method||'GET'} ${r.status} ${url} :: ${txt.slice(0,350).replace(/\s+/g,' ')}`
                );
              }

              await sleep(
                450*Math.pow(2,i)
              );
            }
          }

          async function httpFD(url){

            const r=
              await fetchRetry(
                url,
                {
                  headers:HEAD_FD
                }
              );

            return r.json();
          }

          async function gh(
            url,
            opt={}
          ){

            return fetchRetry(
              url,
              {
                ...opt,

                headers:{
                  ...HEAD_GH,
                  ...(opt.headers||{})
                }
              }
            );
          }

          async function readCurrent(){

            const r=
              await gh(
                `https://api.github.com/gists/${process.env.GIST_ID}`
              );

            const j=
              await r.json();

            const f=
              j.files?.[
                process.env.GIST_FILE
                ||
                'Classifica.json'
              ];

            try{

              return f?.content
                ?
                  JSON.parse(
                    f.content
                  )
                :
                  {};

            }catch{

              return {};
            }
          }

          async function writeGist(payload){

            const body={
              files:{
                [
                  process.env.GIST_FILE
                  ||
                  'Classifica.json'
                ]:{
                  content:
                    JSON.stringify(
                      payload,
                      null,
                      2
                    )
                }
              }
            };

            await gh(
              `https://api.github.com/gists/${process.env.GIST_ID}`,
              {
                method:'PATCH',

                headers:{
                  'content-type':'application/json'
                },

                body:
                  JSON.stringify(body)
              }
            );
          }

          /*
            Stato Fantacena normalizzato:

            pre  = da giocare
            in   = live
            post = finita
          */
          function canonicalStatus(s){

            const st=
              String(s||'')
                .trim()
                .toUpperCase()
                .replace(
                  /[-\s]+/g,
                  '_'
                );

            if(
              [
                'FINISHED',
                'AWARDED',
                'POST',
                'FT',
                'AET',
                'PEN',
                'FULL_TIME'
              ].includes(st)
            ){
              return 'post';
            }

            if(
              [
                'LIVE',
                'IN_PLAY',
                'PAUSED',
                'HALF_TIME',
                'HT',
                'EXTRA_TIME',
                '1H',
                '2H',
                'ET',
                'BT',
                'P',
                'INT',
                'SUSP'
              ].includes(st)
            ){
              return 'in';
            }

            if(
              [
                'SCHEDULED',
                'TIMED',
                'PRE',
                'NS',
                'TBD',
                'PST'
              ].includes(st)
            ){
              return 'pre';
            }

            return 'off';
          }

          function rank(s){

            const st=
              canonicalStatus(s);

            return st==='post'
              ?
                3
              :
                st==='in'
                  ?
                    2
                  :
                    st==='pre'
                      ?
                        1
                      :
                        0;
          }

          const asNum=v=>
            Number.isFinite(
              Number(v)
            )
              ?
                Number(v)
              :
                0;

          /*
            La chiave NON contiene l'orario.

            Se un provider modifica leggermente
            il kickoff, la partita resta la stessa.
          */
          const matchKey=r=>
            `${String(r?.home||'').toLowerCase()}|${String(r?.away||'').toLowerCase()}`;

          /*
            REGOLA FONDAMENTALE:

            PRE -> LIVE -> FINITA

            MAI INDIETRO.
          */
          function mergeMatch(
            existing,
            incoming
          ){

            if(!existing){
              return incoming;
            }

            if(!incoming){
              return existing;
            }

            const oldRank=
              rank(
                existing.status
              );

            const newRank=
              rank(
                incoming.status
              );

            /*
              Se il nuovo provider restituisce
              uno stato più vecchio, ignoralo.
            */
            if(
              newRank
              <
              oldRank
            ){
              return existing;
            }

            const merged={
              ...existing,
              ...incoming,

              status:
                canonicalStatus(
                  incoming.status
                )
            };

            /*
              Un null non cancella mai
              un risultato già conosciuto.
            */
            if(
              incoming.sh==null
              &&
              existing.sh!=null
            ){
              merged.sh=
                existing.sh;
            }

            if(
              incoming.sa==null
              &&
              existing.sa!=null
            ){
              merged.sa=
                existing.sa;
            }

            if(
              !incoming.start
              &&
              existing.start
            ){
              merged.start=
                existing.start;
            }

            return merged;
          }

          function putMatch(
            map,
            r
          ){

            if(
              !r?.home
              ||
              !r?.away
            ){
              return;
            }

            if(
              !TARGET_SET.has(r.home)
              ||
              !TARGET_SET.has(r.away)
            ){
              return;
            }

            const k=
              matchKey(r);

            map.set(
              k,
              mergeMatch(
                map.get(k),
                r
              )
            );
          }

          /*
            ========================================================
            FINESTRE API-FOOTBALL
            ========================================================

            Una sola richiesta API-Football
            per ogni esecuzione del workflow.

            VENERDÌ:
            18:25 - 20:35
            20:40 - 23:05

            SABATO:
            18:25 - 20:35
            20:40 - 23:05

            DOMENICA:
            14:55 - 17:20
            18:25 - 20:35
            20:40 - 23:05

            LUNEDÌ:
            18:25 - 20:35
            20:40 - 23:05

            Tutto in Europe/Rome.
            ========================================================
          */

          function romeClock(now){

            const p=
              new Intl.DateTimeFormat(
                'en-US',
                {
                  timeZone:TZ,
                  weekday:'short',
                  hour:'2-digit',
                  minute:'2-digit',
                  hourCycle:'h23'
                }
              ).formatToParts(now);

            const get=t=>
              p.find(
                x=>x.type===t
              )?.value
              ||
              '';

            return {
              weekday:
                get('weekday'),

              hour:
                Number(
                  get('hour')
                ),

              minute:
                Number(
                  get('minute')
                )
            };
          }

          const hm=(h,m)=>
            h*60+m;

          const inside=(
            v,
            a,
            b
          )=>
            v>=a
            &&
            v<=b;

          function apiFootballWindow(now){

            const c=
              romeClock(now);

            const m=
              hm(
                c.hour,
                c.minute
              );

            const evening=
              inside(
                m,
                hm(18,25),
                hm(20,35)
              )
              ||
              inside(
                m,
                hm(20,40),
                hm(23,5)
              );

            if(
              [
                'Fri',
                'Sat',
                'Mon'
              ].includes(
                c.weekday
              )
            ){
              return evening;
            }

            if(
              c.weekday==='Sun'
            ){

              return (
                inside(
                  m,
                  hm(14,55),
                  hm(17,20)
                )
                ||
                evening
              );
            }

            return false;
          }

          function pad(v){

            return String(v)
              .padStart(
                2,
                '0'
              );
          }

          function dstrUTC(d){

            return (
              `${d.getUTCFullYear()}`
              +
              '-'
              +
              `${pad(d.getUTCMonth()+1)}`
              +
              '-'
              +
              `${pad(d.getUTCDate())}`
            );
          }

          /*
            ========================================================
            FOOTBALL-DATA:
            CLASSIFICA + CALENDARIO
            ========================================================
          */

          async function fetchStandings(){

            const j=
              await httpFD(
                `${FD}/competitions/${COMP}/standings`
              );

            const table=
              j.standings
                ?.find(
                  s=>/TOTAL/i.test(s.type)
                )
                ?.table
              ||
              [];

            const rows=[];
            const seen=
              new Set();

            for(
              const r
              of
              table
            ){

              const team=
                normTeam(
                  r.team?.shortName
                  ||
                  r.team?.name
                  ||
                  r.team?.tla
                );

              if(
                !TARGET_SET.has(team)
                ||
                seen.has(team)
              ){
                continue;
              }

              seen.add(team);

              rows.push({
                team,

                played:
                  asNum(
                    r.playedGames
                  ),

                points:
                  asNum(
                    r.points
                  )
              });
            }

            for(
              const team
              of
              TARGET_TEAMS
            ){

              if(
                !seen.has(team)
              ){

                rows.push({
                  team,
                  played:0,
                  points:0
                });
              }
            }

            const played=
              rows.map(
                r=>r.played
              );

            const playedMax=
              Math.max(
                0,
                ...played
              );

            const providerMatchday=
              Number(
                j?.season?.currentMatchday
              )
              ||
              playedMax
              ||
              1;

            return {
              giornata:
                playedMax,

              providerMatchday:
                Math.max(
                  providerMatchday,
                  playedMax,
                  1
                ),

              teams:
                rows.map(
                  r=>r.team
                ),

              pos_real:
                rows.map(
                  (_,i)=>i+1
                ),

              played,

              points:
                rows.map(
                  r=>r.points
                )
            };
          }

          function normalizeFDMatch(m){

            return {
              id:
                m?.id
                ??
                null,

              fd_id:
                m?.id
                ??
                null,

              home:
                normTeam(
                  m?.homeTeam?.shortName
                  ||
                  m?.homeTeam?.name
                  ||
                  m?.homeTeam?.tla
                ),

              away:
                normTeam(
                  m?.awayTeam?.shortName
                  ||
                  m?.awayTeam?.name
                  ||
                  m?.awayTeam?.tla
                ),

              /*
                NON prendiamo i risultati
                da football-data.

                Serve soltanto per calendario.
              */
              sh:null,
              sa:null,
              status:'pre',

              start:
                m?.utcDate
                ||
                null,

              matchday:
                Number(
                  m?.matchday
                )
                ||
                null,

              fd_status:
                String(
                  m?.status
                  ||
                  ''
                ).toUpperCase()
                ||
                null,

              source_schedule:
                'football-data.org'
            };
          }

          async function fetchCurrentMatchdaySchedule(
            matchday
          ){

            const j=
              await httpFD(
                `${FD}/competitions/${COMP}/matches?matchday=${Number(matchday)}`
              );

            return (
              j.matches
              ||
              []
            )
              .map(
                normalizeFDMatch
              )
              .filter(
                r=>
                  TARGET_SET.has(r.home)
                  &&
                  TARGET_SET.has(r.away)
              );
          }

          /*
            ========================================================
            API-FOOTBALL:
            RISULTATI LIVE + FINALI
            ========================================================
          */

          function normalizeAFMatch(x){

            const fixture=
              x?.fixture
              ||
              {};

            const teams=
              x?.teams
              ||
              {};

            const goals=
              x?.goals
              ||
              {};

            const score=
              x?.score
              ||
              {};

            const st=
              fixture?.status
              ||
              {};

            return {
              id:
                fixture?.id
                ??
                null,

              api_football_id:
                fixture?.id
                ??
                null,

              home:
                normTeam(
                  teams?.home?.name
                ),

              away:
                normTeam(
                  teams?.away?.name
                ),

              sh:
                goals?.home
                ??
                score?.fulltime?.home
                ??
                score?.halftime?.home
                ??
                null,

              sa:
                goals?.away
                ??
                score?.fulltime?.away
                ??
                score?.halftime?.away
                ??
                null,

              status:
                canonicalStatus(
                  st?.short
                  ||
                  st?.long
                ),

              start:
                fixture?.date
                ||
                null,

              provider_status:
                String(
                  st?.short
                  ||
                  st?.long
                  ||
                  ''
                ).toUpperCase()
                ||
                null,

              provider_elapsed:
                Number.isFinite(
                  Number(
                    st?.elapsed
                  )
                )
                  ?
                    Number(
                      st.elapsed
                    )
                  :
                    null,

              source_results:
                'api-football'
            };
          }

          /*
            Una SOLA chiamata API-Football.

            Cerchiamo gli ultimi 7 giorni
            fino a domani.

            Questo serve anche a recuperare
            eventuali risultati precedenti
            che football-data aveva lasciato TIMED.
          */
          async function fetchApiFootballFixtures(now){

            const from=
              new Date(
                now.getTime()
                -
                7*24*60*60*1000
              );

            const to=
              new Date(
                now.getTime()
                +
                24*60*60*1000
              );

            const url=
              `${AF}/fixtures`
              +
              `?league=${AF_LEAGUE}`
              +
              `&season=${AF_SEASON}`
              +
              `&from=${dstrUTC(from)}`
              +
              `&to=${dstrUTC(to)}`;

            const r=
              await fetchRetry(
                url,
                {
                  headers:HEAD_AF
                }
              );

            const remaining=
              r.headers.get(
                'x-ratelimit-requests-remaining'
              )
              ||
              r.headers.get(
                'x-ratelimit-remaining'
              )
              ||
              null;

            const j=
              await r.json();

            const errors=
              j?.errors;

            const hasErrors=
              Array.isArray(errors)
                ?
                  errors.length>0
                :
                  (
                    errors
                    &&
                    typeof errors==='object'
                    &&
                    Object.keys(errors).length>0
                  );

            if(hasErrors){

              throw new Error(
                `API-Football errors: ${JSON.stringify(errors).slice(0,500)}`
              );
            }

            const rows=
              (
                j.response
                ||
                []
              )
                .map(
                  normalizeAFMatch
                )
                .filter(
                  r=>
                    TARGET_SET.has(r.home)
                    &&
                    TARGET_SET.has(r.away)
                );

            return {
              rows,
              remaining
            };
          }

          function isZeroStartCurrent(
            current
          ){

            const g=
              asNum(
                current.giornata
              );

            const played=
              Array.isArray(
                current.played
              )
                ?
                  current.played.map(
                    asNum
                  )
                :
                  [];

            const points=
              Array.isArray(
                current.points
              )
                ?
                  current.points.map(
                    asNum
                  )
                :
                  [];

            return (
              g===0
              &&
              played.length>0
              &&
              points.length>0
              &&
              played.every(
                v=>v===0
              )
              &&
              points.every(
                v=>v===0
              )
            );
          }

          (async()=>{

            const now=
              new Date();

            /*
              Legge il Gist precedente.

              Serve anche per garantire:
              PRE -> LIVE -> POST
              mai indietro.
            */
            const current=
              await readCurrent();

            /*
              CLASSIFICA:
              sempre football-data.
            */
            const st=
              await fetchStandings();

            /*
              Protezione pre-campionato.
            */
            if(
              isZeroStartCurrent(current)
              &&
              st.giornata>5
            ){

              console.log(
                `🛑 Preseason guard: Gist non modificato. football-data giornata=${st.giornata}`
              );

              return;
            }

            /*
              CALENDARIO:
              sempre football-data.
            */
            const schedule=
              await fetchCurrentMatchdaySchedule(
                st.providerMatchday
              );

            /*
              Le chiavi delle 10 partite
              della giornata corrente.
            */
            const currentRoundKeys=
              new Set(
                schedule.map(
                  matchKey
                )
              );

            const map=
              new Map();

            /*
              1) MEMORIA.

              Conserva il miglior stato già visto.

              Se una partita era LIVE,
              una successiva risposta PRE
              non la fa tornare indietro.

              Se era FINITA,
              rimane FINITA.
            */
            const previous=[
              ...(
                Array.isArray(
                  current.results_raw
                )
                  ?
                    current.results_raw
                  :
                    []
              ),

              ...(
                Array.isArray(
                  current.upcoming_raw
                )
                  ?
                    current.upcoming_raw
                  :
                    []
              )
            ];

            for(
              const raw
              of
              previous
            ){

              putMatch(
                map,
                {
                  ...raw,

                  home:
                    normTeam(
                      raw?.home
                    ),

                  away:
                    normTeam(
                      raw?.away
                    ),

                  status:
                    canonicalStatus(
                      raw?.status
                    ),

                  start:
                    raw?.start
                    ||
                    raw?.utcDate
                    ||
                    null,

                  sh:
                    raw?.sh
                    ??
                    null,

                  sa:
                    raw?.sa
                    ??
                    null
                }
              );
            }

            /*
              2) CALENDARIO FOOTBALL-DATA.

              Fornisce partite e orari.

              Poiché queste entrano come PRE,
              mergeMatch NON può far regredire
              una partita già LIVE o FINITA.
            */
            for(
              const r
              of
              schedule
            ){

              putMatch(
                map,
                r
              );
            }

            let apiFootballCalled=false;
            let apiFootballRemaining=null;
            let apiFootballRows=0;
            let apiFootballError=null;

            const inLiveWindow=
              apiFootballWindow(
                now
              );

            /*
              3) RISULTATI API-FOOTBALL.

              UNA SOLA richiesta per esecuzione.

              La chiamata parte solo:
              - nelle finestre definite;
              - oppure se manualmente scegli
                force_api_football=true.
            */
            if(
              FORCE_AF
              ||
              inLiveWindow
            ){

              try{

                const af=
                  await fetchApiFootballFixtures(
                    now
                  );

                apiFootballCalled=true;

                apiFootballRemaining=
                  af.remaining;

                apiFootballRows=
                  af.rows.length;

                /*
                  Importiamo soltanto le partite
                  che appartengono alla giornata
                  corrente di Fantacena.
                */
                for(
                  const r
                  of
                  af.rows
                ){

                  if(
                    currentRoundKeys.has(
                      matchKey(r)
                    )
                  ){

                    putMatch(
                      map,
                      r
                    );
                  }
                }

                console.log(
                  `⚽ API-Football OK | fixtures=${af.rows.length} | quota residua=${apiFootballRemaining??'?'}`
                );

              }catch(e){

                apiFootballCalled=true;

                apiFootballError=
                  e.message
                  ||
                  String(e);

                console.warn(
                  '⚠️ API-Football non disponibile:',
                  apiFootballError
                );
              }

            }else{

              console.log(
                '⏸️ API-Football non chiamata: fuori dalla finestra risultati.'
              );
            }

            /*
              Manteniamo nel JSON le 10 partite
              della giornata corrente.
            */
            const results_raw=
              [...map.values()]

                .filter(
                  r=>
                    currentRoundKeys.has(
                      matchKey(r)
                    )
                )

                .sort(
                  (a,b)=>
                    String(
                      a.start
                      ||
                      ''
                    ).localeCompare(
                      String(
                        b.start
                        ||
                        ''
                      )
                    )
                );

            /*
              upcoming_raw contiene soltanto
              partite ancora PRE
              e con kickoff futuro.
            */
            let upcoming_raw=
              results_raw

                .filter(r=>{

                  const t=
                    Date.parse(
                      r?.start
                      ||
                      ''
                    );

                  return (
                    canonicalStatus(
                      r.status
                    )==='pre'
                    &&
                    Number.isFinite(t)
                    &&
                    t>now.getTime()
                  );
                })

                .sort(
                  (a,b)=>
                    Date.parse(
                      a.start
                      ||
                      0
                    )
                    -
                    Date.parse(
                      b.start
                      ||
                      0
                    )
                );

            if(
              ORDER==='desc'
            ){

              upcoming_raw=
                upcoming_raw.reverse();
            }

            const payload={
              ...current,

              /*
                CLASSIFICA:
                football-data.
              */
              giornata:
                st.giornata,

              teams:
                st.teams,

              pos_real:
                st.pos_real,

              played:
                st.played,

              points:
                st.points,

              /*
                PARTITE:
                calendario football-data
                + risultati API-Football.
              */
              results_raw,

              upcoming_raw,

              counts:{

                pre:
                  results_raw.filter(
                    r=>
                      canonicalStatus(
                        r.status
                      )==='pre'
                  ).length,

                in:
                  results_raw.filter(
                    r=>
                      canonicalStatus(
                        r.status
                      )==='in'
                  ).length,

                post:
                  results_raw.filter(
                    r=>
                      canonicalStatus(
                        r.status
                      )==='post'
                  ).length
              },

              synced_at:
                now.toISOString(),

              _meta:{

                timezone:
                  TZ,

                order_upcoming:
                  ORDER,

                provider_matchday:
                  st.providerMatchday,

                api_football:{

                  called:
                    apiFootballCalled,

                  forced:
                    FORCE_AF,

                  in_live_window:
                    inLiveWindow,

                  rows:
                    apiFootballRows,

                  remaining_requests:
                    apiFootballRemaining,

                  error:
                    apiFootballError
                },

                now_local:
                  new Intl.DateTimeFormat(
                    'sv-SE',
                    {
                      timeZone:TZ,
                      hour12:false,
                      dateStyle:'short',
                      timeStyle:'medium'
                    }
                  ).format(now),

                now_utc:
                  now.toISOString(),

                run_id:
                  process.env.GITHUB_RUN_ID
                  ||
                  null,

                run_attempt:
                  process.env.GITHUB_RUN_ATTEMPT
                  ||
                  null,

                repo:
                  process.env.GITHUB_REPOSITORY
                  ||
                  null,

                workflow:
                  process.env.GITHUB_WORKFLOW
                  ||
                  null,

                sha:
                  process.env.GITHUB_SHA
                  ||
                  null
              },

              _sources:{

                standings:
                  'football-data.org',

                schedule:
                  'football-data.org',

                results_live_final:
                  'api-football',

                api_football_league:
                  AF_LEAGUE,

                api_football_season:
                  AF_SEASON,

                scorers:
                  'manual'
              }
            };

            await writeGist(
              payload
            );

            console.log(
              `✅ Gist aggiornato | giornata=${payload.giornata}`
              +
              ` | results=${results_raw.length}`
              +
              ` | pre:${payload.counts.pre}`
              +
              ` in:${payload.counts.in}`
              +
              ` post:${payload.counts.post}`
              +
              ` | API-Football=${apiFootballCalled?'SI':'NO'}`
            );

          })().catch(e=>{

            console.error(
              '❌ FATAL:',
              e.stack
              ||
              e.message
              ||
              String(e)
            );

            process.exit(1);
          });

          NODE
